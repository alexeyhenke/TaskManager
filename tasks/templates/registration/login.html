<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!--    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">-->
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="text-center mb-4 text-primary">Войти в аккаунт</h2>

            <form method="POST" action="">
                {% csrf_token %}

                <!-- Вывод ошибок, если логин или пароль неверные -->
                {% if form.errors %}
                    <div class="alert alert-danger text-center p-2" style="font-size: 0.9rem;">
                        Неверный логин или пароль!
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">Имя пользователя (Логин)</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
            </form>

            <div class="text-center" style="font-size: 0.9rem;">
                Ещё нет аккаунта? <a href="/register/">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</body>
</html>
