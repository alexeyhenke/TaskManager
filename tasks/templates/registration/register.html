<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация нового пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 450px; margin-top: 80px;">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="text-center mb-4 text-success">Регистрация</h2>

            <form method="POST" action="">
                {% csrf_token %}

                <!-- Django сам сгенерирует поля формы (Логин, Пароль, Подтверждение) -->
                <!-- Мы добавляем Bootstrap-класс form-control через специальный тег -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        <!-- Вывод подсказок (например, требования к паролю) -->
                        {% if field.help_text %}
                            <div class="form-text text-muted" style="font-size: 0.75rem;">
                                {{ field.help_text|safe }}
                            </div>
                        {% endif %}
                        <!-- Вывод ошибок для конкретного поля -->
                        {% for error in field.errors %}
                            <div class="text-danger" style="font-size: 0.8rem;">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-success w-100 mb-3">Создать аккаунт</button>
            </form>

            <div class="text-center" style="font-size: 0.9rem;">
                Уже есть аккаунт? <a href="/login/">Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
