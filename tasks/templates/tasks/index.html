<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Мой Менеджер Задач</title>
    </head>
    <body>
        <h1>Список моих задач</h1>
        <!-- Новая форма для добавления задачи -->
        <form action="" method="POST">
            {% csrf_token %}
            <input name="task_title" placeholder="Что нужно сделать?" required type="text">
            <button type="submit">Добавить</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li style="margin-bottom: 10px;">
                    <!-- Отображение текста задачи -->
                    {% if task.is_completed %}
                        <s style="color: gray;">{{ task.title }}</s> ✅
                    {% else %}
                        <span>{{ task.title }}</span>
                    {% endif %}

                    <!-- Кнопка Выполнено (показываем только для невыполненных) -->
                    {% if not task.is_completed %}
                        <form method="POST" action="" style="display: inline; margin-left: 10px;">
                            {% csrf_token %}
                            <input type="hidden" name="task_id" value="{{ task.id }}">
                            <button type="submit" name="action" value="complete">Выполнено</button>
                        </form>
                    {% endif %}

                    <!-- Кнопка Удалить (показываем всегда) -->
                    <form method="POST" action="" style="display: inline; margin-left: 5px;">
                        {% csrf_token %}
                        <input type="hidden" name="task_id" value="{{ task.id }}">
                        <button type="submit" name="action" value="delete" style="color: red;">Удалить</button>
                    </form>
                </li>
            {% empty %}
                <li>Задач пока нет!</li>
            {% endfor %}
        </ul>
    </body>
</html>
